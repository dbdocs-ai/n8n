name: n8n Live

on:
  workflow_dispatch:

jobs:
  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install n8n
        run: |
          npm install -g n8n

      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start n8n
        env:
          N8N_HOST: 0.0.0.0
          N8N_PORT: 5678
          N8N_PROTOCOL: http
          N8N_SECURE_COOKIE: false
          N8N_DIAGNOSTICS_ENABLED: false
          N8N_EDITOR_BASE_URL: http://localhost:5678
        run: |
          nohup n8n > n8n.log 2>&1 &
          echo "Waiting for n8n to start..."
          sleep 20

      - name: Start Cloudflare Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:5678 > tunnel.log 2>&1 &
          echo "Waiting for tunnel..."
          sleep 10

      - name: Get Public URL
        shell: bash
        run: |
          echo "Searching for Cloudflare Tunnel URL..."

          for i in {1..60}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log | head -n1)

            if [ -n "$URL" ]; then
              echo ""
              echo "======================================="
              echo "🚀 n8n Public URL"
              echo "$URL"
              echo "======================================="
              exit 0
            fi

            sleep 2
          done

          echo "❌ Tunnel URL not found."
          echo ""
          cat tunnel.log
          exit 1

      - name: Monitor Server (6 Hours)
        shell: bash
        run: |
          echo "Monitoring server for 6 hours..."

          END=$((SECONDS+21600))

          while [ $SECONDS -lt $END ]; do

            echo ""
            echo "======================================="
            echo "🖥 SERVER STATUS"
            echo "======================================="
            echo "Time: $(date)"
            echo ""

            echo "Hostname:"
            hostname
            echo ""

            echo "Uptime:"
            uptime -p
            echo ""

            echo "CPU:"
            uptime
            echo ""

            echo "Memory:"
            free -h
            echo ""

            echo "Disk:"
            df -h /
            echo ""

            echo "Network:"
            ip -br addr || ip addr
            echo ""

            echo "n8n Process:"
            pgrep -af n8n || echo "Not running"
            echo ""

            echo "Cloudflared Process:"
            pgrep -af cloudflared || echo "Not running"
            echo ""

            echo "Last 5 lines of n8n log:"
            tail -n 5 n8n.log || true
            echo ""

            echo "Last 5 lines of tunnel log:"
            tail -n 5 tunnel.log || true
            echo ""

            echo "Next update in 60 seconds..."
            echo "======================================="

            sleep 60
          done

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-logs
          path: |
            n8n.log
            tunnel.log
