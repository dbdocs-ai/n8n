name: n8n Live

on:
  workflow_dispatch:

jobs:
  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install n8n
        run: |
          npm install -g n8n

      - name: Download cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start n8n
        env:
          N8N_HOST: 0.0.0.0
          N8N_PORT: 5678
          N8N_PROTOCOL: http
          N8N_SECURE_COOKIE: false
          N8N_DIAGNOSTICS_ENABLED: false
          N8N_EDITOR_BASE_URL: http://localhost:5678
        run: |
          nohup n8n > n8n.log 2>&1 &
          sleep 20

      - name: Start Cloudflare Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:5678 > tunnel.log 2>&1 &
          sleep 10

      - name: Get Public URL
        run: |
          echo "Waiting for Cloudflare Tunnel..."
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log | head -n1)
            if [ -n "$URL" ]; then
              echo ""
              echo "========================================"
              echo "🚀 n8n Live URL:"
              echo "$URL"
              echo "========================================"
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Tunnel URL not found."
            cat tunnel.log
            exit 1
          fi

      - name: Server Status Monitor
        run: |
          echo "Monitoring server for 6 hours..."

          END=$((SECONDS+21600))

          while [ $SECONDS -lt $END ]; do
            clear

            echo "========================================"
            echo "🖥 SERVER STATUS"
            echo "========================================"
            echo "Time: $(date)"
            echo ""

            echo "Hostname:"
            hostname
            echo ""

            echo "Uptime:"
            uptime -p
            echo ""

            echo "CPU Load:"
            uptime
            echo ""

            echo "Memory:"
            free -h
            echo ""

            echo "Disk:"
            df -h /
            echo ""

            echo "Network:"
            ip -br addr
            echo ""

            echo "Next update in 60 seconds..."
            echo "========================================"

            sleep 60
          done
